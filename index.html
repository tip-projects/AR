<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <title>Black Box</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      overflow: hidden;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
    }

    video,
    canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    video {
      object-fit: cover;
    }

    canvas {
      pointer-events: none;
    }

    #welcome {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: grid;
      place-items: center;
      padding: 28px;
      background: #111;
      text-align: center;
    }

    h1 {
      font-size: 38px;
      margin-bottom: 12px;
    }

    p {
      color: #ccc;
      line-height: 1.5;
    }

    button {
      border: none;
      border-radius: 30px;
      padding: 15px 30px;
      background: #ffdc51;
      color: #111;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.5;
    }

    #guide {
      position: fixed;
      z-index: 3;
      border: 2px dashed #ffdc51;
      border-radius: 8px;
      pointer-events: none;
    }

    #hud {
      position: fixed;
      inset: 0;
      z-index: 4;
      pointer-events: none;
    }

    #hint {
      position: absolute;
      top: max(24px, env(safe-area-inset-top));
      left: 20px;
      right: 20px;
      text-align: center;
      font-size: 15px;
      text-shadow: 0 2px 8px black;
    }

    #drop {
      position: absolute;
      bottom: max(35px, env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%);
      pointer-events: auto;
    }

    [hidden] {
      display: none !important;
    }
  </style>
</head>

<body>

  <video id="camera" autoplay muted playsinline></video>

  <div id="welcome">
    <div>
      <h1>Something big<br>is coming.</h1>

      <p>Point your camera at the black box.</p>

      <button id="start" disabled>Loading…</button>

      <p id="error" role="alert"></p>
    </div>
  </div>

  <div id="guide" hidden></div>

  <div id="hud" hidden>
    <div id="hint" role="status">
      Fit the box inside the guide. Hold still.
    </div>

    <button id="drop">Drop</button>
  </div>

  <script type="module">
    // Physical installation: 9 feet.
    // Virtual cube: 3 feet.
    //
    // Scale is estimated from the on-screen guide.
    // This is a camera overlay, not world-tracked AR.

    const REAL_BOX_FEET = 9;
    const VIRTUAL_BOX_FEET = 3;

    const CUBE_SIZE = VIRTUAL_BOX_FEET * 0.3048;
    const FALL_TIME = 1.4;
    const EFFECT_TIME = 4.2;

    const $ = id => document.getElementById(id);

    let THREE;
    let renderer;

    try {
      THREE = await import(
        "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"
      );

      renderer = new THREE.WebGLRenderer({
        alpha: true,
        antialias: true
      });
    } catch (error) {
      $("start").textContent = "Unable to load";
      $("error").textContent =
        "Check your connection and reload the page.";

      throw error;
    }

    renderer.setClearColor(0x000000, 0);
    renderer.setPixelRatio(
      Math.min(window.devicePixelRatio || 1, 2)
    );

    document.body.prepend(renderer.domElement);

    const scene = new THREE.Scene();

    const view = new THREE.OrthographicCamera(
      -2, 2, 2, -2, 0.01, 100
    );

    view.position.set(0, 3, 7);
    view.lookAt(0, 0, 0);
    view.updateMatrixWorld();

    scene.add(
      new THREE.HemisphereLight(
        0xffffff,
        0x665544,
        2.5
      )
    );

    const light = new THREE.DirectionalLight(
      0xffffff,
      3
    );

    light.position.set(-3, 6, 5);
    scene.add(light);

    const effect = new THREE.Group();
    scene.add(effect);

    const cube = new THREE.Mesh(
      new THREE.BoxGeometry(
        CUBE_SIZE,
        CUBE_SIZE,
        CUBE_SIZE
      ),

      new THREE.MeshStandardMaterial({
        color: 0x08090b,
        roughness: 0.85,
        metalness: 0.1
      })
    );

    effect.add(cube);

    const rubble = new THREE.Group();
    effect.add(rubble);

    const rockGeometry =
      new THREE.DodecahedronGeometry(1, 0);

    const rockMaterials = [
      0x494741,
      0x777168,
      0x333330
    ].map(color => {
      return new THREE.MeshStandardMaterial({
        color,
        roughness: 1
      });
    });

    const rocks = [];

    for (let i = 0; i < 30; i++) {
      const angle = i * 2.39996;
      const dx = Math.cos(angle);
      const dz = Math.sin(angle);

      const edge =
        CUBE_SIZE / 2 /
        Math.max(Math.abs(dx), Math.abs(dz));

      const radius = edge + 0.08 + (i % 4) * 0.06;
      const size = 0.035 + (i % 4) * 0.018;

      const rock = new THREE.Mesh(
        rockGeometry,
        rockMaterials[i % 3]
      );

      rock.scale.set(
        size * 1.6,
        size,
        size * 1.2
      );

      rock.rotation.set(i, i * 0.7, i * 0.4);

      rubble.add(rock);

      rocks.push({
        mesh: rock,
        x: dx * radius,
        z: dz * radius,
        y: size * 0.6
      });
    }

    const dust = [];

    const dustGeometry =
      new THREE.SphereGeometry(1, 8, 6);

    for (let i = 0; i < 12; i++) {
      const puff = new THREE.Mesh(
        dustGeometry,

        new THREE.MeshStandardMaterial({
          color: 0xa39784,
          transparent: true,
          opacity: 0,
          depthWrite: false,
          roughness: 1
        })
      );

      effect.add(puff);
      dust.push(puff);
    }

    let stream = null;
    let audio = null;
    let running = false;
    let impacted = false;
    let elapsed = 0;
    let previousTime = null;
    let ready = false;

    effect.visible = false;

    function layout() {
      const width = window.innerWidth;
      const height = window.innerHeight;

      renderer.setSize(width, height);

      const guideSize = Math.min(
        width * 0.78,
        height * 0.42
      );

      const baseline = height * 0.66;

      $("guide").style.width = guideSize + "px";
      $("guide").style.height = guideSize + "px";
      $("guide").style.left =
        (width - guideSize) / 2 + "px";

      $("guide").style.top =
        baseline - guideSize + "px";

      // The virtual cube is one third of the
      // guide width: 3 ft compared with 9 ft.

      const virtualPixelWidth =
        guideSize *
        (VIRTUAL_BOX_FEET / REAL_BOX_FEET);

      const unitsPerPixel =
        CUBE_SIZE / virtualPixelWidth;

      const halfWidth = width * unitsPerPixel / 2;
      const halfHeight = height * unitsPerPixel / 2;

      // Align the virtual cube's front bottom edge
      // with the bottom of the real-box guide.

      const frontBase = new THREE.Vector3(
        0,
        0,
        CUBE_SIZE / 2
      ).applyMatrix4(view.matrixWorldInverse);

      const targetY = 1 - 2 * baseline / height;
      const centreY =
        frontBase.y - targetY * halfHeight;

      view.left = -halfWidth;
      view.right = halfWidth;
      view.top = centreY + halfHeight;
      view.bottom = centreY - halfHeight;

      view.updateProjectionMatrix();
    }

    function impactSound() {
      if (!audio || audio.state !== "running") {
        return;
      }

      const now = audio.currentTime;
      const oscillator = audio.createOscillator();
      const gain = audio.createGain();

      oscillator.frequency.setValueAtTime(110, now);

      oscillator.frequency.exponentialRampToValueAtTime(
        28,
        now + 0.6
      );

      gain.gain.setValueAtTime(0.35, now);

      gain.gain.exponentialRampToValueAtTime(
        0.001,
        now + 0.75
      );

      oscillator.connect(gain);
      gain.connect(audio.destination);

      oscillator.start(now);
      oscillator.stop(now + 0.8);

      oscillator.onended = () => {
        oscillator.disconnect();
        gain.disconnect();
      };
    }

    function prepare() {
      running = false;
      effect.visible = false;
      rubble.visible = false;

      dust.forEach(puff => {
        puff.visible = false;
      });

      $("guide").hidden = false;
      $("drop").disabled = false;
      $("drop").textContent = "Drop";

      $("hint").textContent =
        "Fit the box inside the guide. Hold still.";
    }

    $("start").onclick = async () => {
      $("start").disabled = true;
      $("error").textContent = "";

      try {
        // If playback needs a second user tap on iOS,
        // reuse the existing camera stream.
        if (!stream) {
          stream = await navigator.mediaDevices.getUserMedia({
            audio: false,

            video: {
              facingMode: { ideal: "environment" },
              width: { ideal: 1280 },
              height: { ideal: 720 }
            }
          });

          $("camera").srcObject = stream;
        }

        $("camera").muted = true;

        await $("camera").play();

        ready = true;

        $("welcome").hidden = true;
        $("hud").hidden = false;

        layout();
        prepare();
      } catch (error) {
        $("start").disabled = false;
        $("start").textContent = "Try again";

        $("error").textContent =
          error.name === "NotAllowedError"
            ? "Allow camera access, then tap Try again."
            : "Camera unavailable. Open this page in Safari or Chrome and try again.";
      }
    };

    $("drop").onclick = () => {
      if (!ready || running) {
        return;
      }

      try {
        const Audio =
          window.AudioContext ||
          window.webkitAudioContext;

        if (Audio) {
          audio ??= new Audio();
          audio.resume().catch(() => {});
        }
      } catch {}

      elapsed = 0;
      previousTime = null;
      impacted = false;
      running = true;

      effect.visible = true;
      rubble.visible = false;

      dust.forEach(puff => {
        puff.visible = false;
      });

      cube.position.set(
        0,
        CUBE_SIZE / 2 + 2.5,
        0
      );

      cube.rotation.set(0, 0, 0);

      $("guide").hidden = true;
      $("drop").disabled = true;
      $("hint").textContent = "Hold still…";
    };

    function animate(time) {
      requestAnimationFrame(animate);

      const dt =
        previousTime === null
          ? 0
          : Math.min(
              (time - previousTime) / 1000,
              0.05
            );

      previousTime = time;

      if (running && !document.hidden) {
        elapsed += dt;

        const progress = Math.min(
          elapsed / FALL_TIME,
          1
        );

        cube.position.y =
          CUBE_SIZE / 2 +
          2.5 * (1 - progress * progress);

        cube.rotation.set(
          (1 - progress) * 0.1,
          (1 - progress) * 0.2,
          (1 - progress) * -0.08
        );

        if (progress === 1) {
          if (!impacted) {
            impacted = true;
            rubble.visible = true;
            impactSound();
          }

          const age = elapsed - FALL_TIME;

          const spread = Math.min(age / 0.65, 1);

          cube.position.y =
            CUBE_SIZE / 2 +
            Math.abs(Math.sin(age * 15)) *
            0.025 *
            Math.exp(-age * 5);

          rocks.forEach(rock => {
            rock.mesh.position.set(
              rock.x * (0.8 + spread * 0.2),

              rock.y +
              Math.sin(spread * Math.PI) * 0.16,

              rock.z * (0.8 + spread * 0.2)
            );
          });

          dust.forEach((puff, i) => {
            const life = Math.max(
              0,
              Math.min(
                (age - i * 0.02) / 1.8,
                1
              )
            );

            const angle =
              i * Math.PI * 2 / dust.length;

            puff.visible =
              age >= i * 0.02 && life < 1;

            puff.material.opacity =
              0.3 * (1 - life);

            puff.position.set(
              Math.cos(angle) * (0.5 + life * 0.65),
              0.05 + life * 0.25,
              Math.sin(angle) * (0.5 + life * 0.65)
            );

            puff.scale.set(
              0.08 + life * 0.3,
              0.05 + life * 0.2,
              0.08 + life * 0.3
            );
          });

          if (elapsed >= EFFECT_TIME) {
            running = false;
            cube.position.y = CUBE_SIZE / 2;

            $("hint").textContent =
              "Choose what’s next.";

            $("drop").disabled = false;
            $("drop").textContent = "Replay";
          }
        }
      }

      renderer.render(scene, view);
    }

    window.addEventListener("resize", () => {
      layout();

      // Screen rotation changes alignment.
      // Return to the guide so users can line up again.
      if (ready) {
        prepare();
      }
    });

    document.addEventListener("visibilitychange", () => {
      previousTime = null;
    });

    window.addEventListener("pagehide", () => {
      stream?.getTracks().forEach(track => track.stop());
    });

    layout();
    requestAnimationFrame(animate);

    if (
      window.isSecureContext &&
      navigator.mediaDevices?.getUserMedia
    ) {
      $("start").disabled = false;
      $("start").textContent = "Start camera";
    } else {
      $("start").textContent = "Camera unavailable";

      $("error").textContent =
        "Open the HTTPS GitHub Pages link in Safari or Chrome.";
    }
  </script>

</body>
</html>
