<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <title>Black Box Experience</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
    }

    #camera {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
    }

    #ar-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      pointer-events: none;
      z-index: 2;
    }

    #welcome {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: grid;
      place-items: center;
      padding: 28px;
      background: #111;
      text-align: center;
    }

    h1 {
      font-size: 38px;
      line-height: 1.1;
      margin-bottom: 16px;
    }

    p {
      color: #ccc;
      line-height: 1.5;
    }

    button {
      border: none;
      border-radius: 30px;
      padding: 15px 30px;
      background: #ffdc51;
      color: #111;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.5;
    }

    #guide {
      position: fixed;
      z-index: 3;
      border: 2px dashed #ffdc51;
      border-radius: 8px;
      pointer-events: none;
    }

    #hud {
      position: fixed;
      inset: 0;
      z-index: 4;
      pointer-events: none;
    }

    #hint {
      position: absolute;
      top: max(24px, env(safe-area-inset-top));
      left: 20px;
      right: 20px;
      text-align: center;
      font-size: 15px;
    }

    #hint span {
      display: inline-block;
      padding: 10px 16px;
      border-radius: 20px;
      background: rgba(0, 0, 0, 0.65);
    }

    #drop {
      position: absolute;
      bottom: max(35px, env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%);
      pointer-events: auto;
    }

    #error {
      max-width: 340px;
      color: #ffca9d;
      font-size: 14px;
    }

    [hidden] {
      display: none !important;
    }
  </style>
</head>

<body>

  <video
    id="camera"
    autoplay
    muted
    playsinline
    webkit-playsinline
  ></video>

  <div id="welcome">
    <div>
      <h1>Something big<br>is coming.</h1>

      <p>Point your camera at the black box.</p>

      <button id="start" disabled>
        Loading…
      </button>

      <p id="error" role="alert"></p>
    </div>
  </div>

  <div id="guide" hidden></div>

  <div id="hud" hidden>
    <div id="hint" role="status">
      <span id="hint-text">
        Fit the real box inside the guide. Hold still.
      </span>
    </div>

    <button id="drop">Drop</button>
  </div>

  <script type="module">
    /*
      Actual box: 9 feet.
      Virtual falling cube: approximately 3 feet
      when the actual box fits the guide.

      This uses a camera overlay.
      It does not automatically detect or track the box.
      Keep the phone still during playback.
    */

    const CONFIG = {
      actualBoxFeet: 9,
      virtualBoxFeet: 3,
      dropHeight: 2.5,
      fallSeconds: 1.6,
      totalSeconds: 4.5
    };

    const $ = id => document.getElementById(id);

    const setHint = text => {
      $("hint-text").textContent = text;
    };

    const clamp = value => {
      return Math.max(0, Math.min(1, value));
    };

    let THREE;
    let renderer;

    try {
      THREE = await import(
        "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"
      );

      renderer = new THREE.WebGLRenderer({
        alpha: true,
        antialias: true
      });
    } catch (error) {
      $("start").textContent = "Unable to load";

      $("error").textContent =
        "Check your internet connection and reload the page.";

      console.error(error);
      throw error;
    }

    renderer.domElement.id = "ar-canvas";

    renderer.setClearColor(0x000000, 0);

    renderer.setPixelRatio(
      Math.min(window.devicePixelRatio || 1, 2)
    );

    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();

    const camera = new THREE.OrthographicCamera(
      -2, 2, 2, -2, 0.01, 100
    );

    camera.position.set(0, 3, 7);
    camera.lookAt(0, 0, 0);
    camera.updateMatrixWorld(true);

    scene.add(
      new THREE.HemisphereLight(
        0xffffff,
        0x665544,
        2.5
      )
    );

    const light = new THREE.DirectionalLight(
      0xffffff,
      3
    );

    light.position.set(-3, 6, 5);
    scene.add(light);

    const effect = new THREE.Group();
    scene.add(effect);

    const cubeSize = CONFIG.virtualBoxFeet * 0.3048;

    const cube = new THREE.Mesh(
      new THREE.BoxGeometry(
        cubeSize,
        cubeSize,
        cubeSize
      ),

      new THREE.MeshStandardMaterial({
        color: 0x090a0c,
        roughness: 0.82,
        metalness: 0.12
      })
    );

    effect.add(cube);

    // Rubble around the landed cube.

    const rubble = new THREE.Group();
    effect.add(rubble);

    const rockGeometry =
      new THREE.DodecahedronGeometry(1, 0);

    const rockMaterials = [
      0x494741,
      0x777168,
      0x333330
    ].map(color => {
      return new THREE.MeshStandardMaterial({
        color,
        roughness: 1
      });
    });

    const rocks = [];

    for (let i = 0; i < 32; i++) {
      const angle = i * 2.39996;
      const dx = Math.cos(angle);
      const dz = Math.sin(angle);

      const edge =
        cubeSize / 2 /
        Math.max(Math.abs(dx), Math.abs(dz));

      const radius =
        edge + 0.08 + (i % 4) * 0.06;

      const size =
        0.035 + (i % 4) * 0.018;

      const rock = new THREE.Mesh(
        rockGeometry,
        rockMaterials[i % 3]
      );

      rock.scale.set(
        size * 1.6,
        size,
        size * 1.2
      );

      rock.rotation.set(
        i,
        i * 0.7,
        i * 0.4
      );

      rubble.add(rock);

      rocks.push({
        mesh: rock,
        x: dx * radius,
        z: dz * radius,
        y: size * 0.6
      });
    }

    // Dust particles.

    const dust = [];

    const dustGeometry =
      new THREE.SphereGeometry(1, 8, 6);

    for (let i = 0; i < 14; i++) {
      const puff = new THREE.Mesh(
        dustGeometry,

        new THREE.MeshStandardMaterial({
          color: 0xa39784,
          transparent: true,
          opacity: 0,
          depthWrite: false,
          roughness: 1
        })
      );

      effect.add(puff);
      dust.push(puff);
    }

    effect.visible = false;

    let stream = null;
    let audio = null;

    let ready = false;
    let running = false;
    let impacted = false;

    let elapsed = 0;
    let previousTime = null;

    function layout() {
      const width = window.innerWidth;
      const height = window.innerHeight;

      renderer.setSize(width, height);

      const guideSize = Math.min(
        width * 0.78,
        height * 0.42
      );

      const baseline = height * 0.66;

      Object.assign($("guide").style, {
        width: guideSize + "px",
        height: guideSize + "px",
        left: (width - guideSize) / 2 + "px",
        top: baseline - guideSize + "px"
      });

      // Virtual cube width = one third of the
      // actual 9-foot box's on-screen guide.

      const virtualPixelWidth =
        guideSize *
        CONFIG.virtualBoxFeet /
        CONFIG.actualBoxFeet;

      const unitsPerPixel =
        cubeSize / virtualPixelWidth;

      const halfWidth =
        width * unitsPerPixel / 2;

      const halfHeight =
        height * unitsPerPixel / 2;

      const frontBase = new THREE.Vector3(
        0,
        0,
        cubeSize / 2
      );

      frontBase.applyMatrix4(
        camera.matrixWorldInverse
      );

      const targetY =
        1 - 2 * baseline / height;

      const centreY =
        frontBase.y - targetY * halfHeight;

      camera.left = -halfWidth;
      camera.right = halfWidth;
      camera.top = centreY + halfHeight;
      camera.bottom = centreY - halfHeight;

      camera.updateProjectionMatrix();
    }

    function prepare() {
      running = false;
      effect.visible = false;
      rubble.visible = false;

      dust.forEach(puff => {
        puff.visible = false;
        puff.material.opacity = 0;
      });

      $("guide").hidden = false;
      $("drop").disabled = false;
      $("drop").textContent = "Drop";

      setHint(
        "Fit the real box inside the guide. Hold still."
      );
    }

    function playImpactSound() {
      if (!audio || audio.state !== "running") {
        return;
      }

      const now = audio.currentTime;

      const oscillator =
        audio.createOscillator();

      const gain =
        audio.createGain();

      oscillator.frequency.setValueAtTime(
        110,
        now
      );

      oscillator.frequency.exponentialRampToValueAtTime(
        28,
        now + 0.6
      );

      gain.gain.setValueAtTime(
        0.35,
        now
      );

      gain.gain.exponentialRampToValueAtTime(
        0.001,
        now + 0.75
      );

      oscillator.connect(gain);
      gain.connect(audio.destination);

      oscillator.start(now);
      oscillator.stop(now + 0.8);

      oscillator.onended = () => {
        oscillator.disconnect();
        gain.disconnect();
      };
    }

    // Start the rear camera.

    $("start").onclick = async () => {
      $("start").disabled = true;
      $("error").textContent = "";

      try {
        const hasLiveTrack = stream
          ?.getVideoTracks()
          .some(track => track.readyState === "live");

        if (!hasLiveTrack) {
          stream = await navigator.mediaDevices.getUserMedia({
            audio: false,

            video: {
              facingMode: {
                ideal: "environment"
              },

              width: {
                ideal: 1280
              },

              height: {
                ideal: 720
              }
            }
          });

          $("camera").srcObject = stream;
        }

        $("camera").muted = true;

        await $("camera").play();

        ready = true;

        $("welcome").hidden = true;
        $("hud").hidden = false;

        layout();
        prepare();
      } catch (error) {
        $("start").disabled = false;
        $("start").textContent = "Try again";

        $("error").textContent =
          error.name === "NotAllowedError"
            ? "Allow camera access, then tap Try again."
            : "Camera unavailable. Open this page in Safari or Chrome and try again.";

        console.error(error);
      }
    };

    // Drop or replay.

    $("drop").onclick = () => {
      if (!ready || running) {
        return;
      }

      try {
        const Audio =
          window.AudioContext ||
          window.webkitAudioContext;

        if (Audio) {
          audio ??= new Audio();

          audio.resume().catch(() => {});
        }
      } catch (error) {
        console.warn("Sound unavailable:", error);
      }

      elapsed = 0;
      previousTime = null;
      impacted = false;
      running = true;

      effect.visible = true;
      rubble.visible = false;

      dust.forEach(puff => {
        puff.visible = false;
        puff.material.opacity = 0;
      });

      cube.position.set(
        0,
        cubeSize / 2 + CONFIG.dropHeight,
        0
      );

      cube.rotation.set(
        0.1,
        0.2,
        -0.08
      );

      $("guide").hidden = true;
      $("drop").disabled = true;

      setHint("Incoming… Hold still.");
    };

    function updateLanding(dt) {
      elapsed += dt;

      const progress = clamp(
        elapsed / CONFIG.fallSeconds
      );

      cube.position.y =
        cubeSize / 2 +
        CONFIG.dropHeight *
        (1 - progress * progress);

      cube.rotation.set(
        (1 - progress) * 0.1,
        (1 - progress) * 0.2,
        (1 - progress) * -0.08
      );

      if (progress < 1) {
        return;
      }

      if (!impacted) {
        impacted = true;
        rubble.visible = true;

        playImpactSound();

        setHint("It has landed.");
      }

      const age =
        elapsed - CONFIG.fallSeconds;

      const spread =
        clamp(age / 0.65);

      cube.position.y =
        cubeSize / 2 +
        Math.abs(Math.sin(age * 15)) *
        0.025 *
        Math.exp(-age * 5);

      rocks.forEach(rock => {
        rock.mesh.position.set(
          rock.x * (0.8 + spread * 0.2),

          rock.y +
          Math.sin(spread * Math.PI) * 0.16,

          rock.z * (0.8 + spread * 0.2)
        );
      });

      dust.forEach((puff, i) => {
        const delay = i * 0.02;

        const life = clamp(
          (age - delay) / 1.8
        );

        const angle =
          i * Math.PI * 2 / dust.length;

        puff.visible =
          age >= delay && life < 1;

        puff.material.opacity =
          0.3 * (1 - life);

        puff.position.set(
          Math.cos(angle) * (0.5 + life * 0.65),
          0.05 + life * 0.25,
          Math.sin(angle) * (0.5 + life * 0.65)
        );

        puff.scale.set(
          0.08 + life * 0.3,
          0.05 + life * 0.2,
          0.08 + life * 0.3
        );
      });

      if (elapsed >= CONFIG.totalSeconds) {
        running = false;

        cube.position.y = cubeSize / 2;
        cube.rotation.set(0, 0, 0);

        $("drop").disabled = false;
        $("drop").textContent = "Replay";

        setHint("Choose what’s next.");
      }
    }

    function animate(time) {
      requestAnimationFrame(animate);

      const dt =
        previousTime === null
          ? 0
          : Math.min(
              (time - previousTime) / 1000,
              0.05
            );

      previousTime = time;

      if (running && !document.hidden) {
        updateLanding(dt);
      }

      renderer.render(scene, camera);
    }

    window.addEventListener("resize", () => {
      layout();

      if (ready) {
        prepare();
      }
    });

    document.addEventListener(
      "visibilitychange",
      () => {
        previousTime = null;
      }
    );

    window.addEventListener("pagehide", () => {
      stream?.getTracks().forEach(track => {
        track.stop();
      });

      stream = null;
      ready = false;
      running = false;

      effect.visible = false;

      $("hud").hidden = true;
      $("guide").hidden = true;
      $("welcome").hidden = false;

      $("start").disabled = false;
      $("start").textContent = "Start camera";
    });

    layout();
    requestAnimationFrame(animate);

    if (
      window.isSecureContext &&
      navigator.mediaDevices?.getUserMedia
    ) {
      $("start").disabled = false;
      $("start").textContent = "Start camera";
    } else {
      $("start").textContent = "Camera unavailable";

      $("error").textContent =
        "Open your HTTPS GitHub Pages link in Safari or Chrome.";
    }
  </script>

</body>
</html>
